<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Void</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050816;
color:white;
overflow-x:hidden;
min-height:100vh;
}

body::before{
content:'';
position:fixed;
width:500px;
height:500px;
background:#9333ea;
filter:blur(180px);
top:-200px;
left:-150px;
opacity:.25;
z-index:-1;
}

body::after{
content:'';
position:fixed;
width:500px;
height:500px;
background:#2563eb;
filter:blur(180px);
bottom:-200px;
right:-150px;
opacity:.20;
z-index:-1;
}

.container{
display:flex;
min-height:100vh;
}

.sidebar{
width:280px;
padding:25px;
background:rgba(255,255,255,0.04);
backdrop-filter:blur(20px);
border-right:1px solid rgba(255,255,255,0.08);
}

.logo{
display:flex;
align-items:center;
gap:15px;
margin-bottom:40px;
}

.logo-box{
width:55px;
height:55px;
border-radius:18px;
background:linear-gradient(135deg,#9333ea,#3b82f6);
}

.logo h1{
font-size:30px;
font-weight:700;
}

.logo p{
color:rgba(255,255,255,.6);
font-size:13px;
}

.menu{
display:flex;
flex-direction:column;
gap:14px;
}

.menu button{
padding:16px;
border:none;
border-radius:18px;
background:rgba(255,255,255,0.05);
color:white;
cursor:pointer;
font-size:15px;
transition:.3s;
text-align:left;
}

.menu button:hover{
transform:translateX(5px);
background:rgba(255,255,255,0.1);
}

.main{
flex:1;
padding:30px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
flex-wrap:wrap;
margin-bottom:35px;
}

.header h2{
font-size:45px;
margin-bottom:10px;
}

.header p{
color:rgba(255,255,255,.6);
}

.input-area{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.input-area input{
width:350px;
padding:16px;
border:none;
outline:none;
border-radius:18px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
color:white;
font-size:15px;
}

.input-area button{
padding:16px 24px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#9333ea,#2563eb);
color:white;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.input-area button:hover{
transform:scale(1.05);
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:22px;
}

.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
border-radius:28px;
padding:22px;
backdrop-filter:blur(20px);
transition:.4s;
}

.card:hover{
transform:translateY(-5px);
border-color:rgba(168,85,247,.5);
}

.card-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}

.icon{
width:55px;
height:55px;
border-radius:18px;
background:rgba(255,255,255,0.08);
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
}

.favorite{
background:none;
border:none;
font-size:22px;
cursor:pointer;
color:gold;
}

.platform{
font-size:25px;
font-weight:600;
margin-bottom:8px;
}

.link{
font-size:13px;
color:rgba(255,255,255,.6);
word-break:break-all;
margin-bottom:20px;
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.actions button{
flex:1;
padding:12px;
border:none;
border-radius:14px;
cursor:pointer;
color:white;
transition:.3s;
min-width:100px;
}

.open-btn{
background:rgba(255,255,255,0.08);
}

.download-btn{
background:linear-gradient(135deg,#9333ea,#2563eb);
}

.copy-btn{
background:rgba(255,255,255,0.08);
}

.delete-btn{
background:rgba(239,68,68,.2);
}

.actions button:hover{
transform:scale(1.03);
}

.empty{
padding:60px;
text-align:center;
border-radius:28px;
background:rgba(255,255,255,0.04);
border:1px dashed rgba(255,255,255,0.08);
color:rgba(255,255,255,.5);
}

.hidden{
display:none;
}

@media(max-width:900px){

.container{
flex-direction:column;
}

.sidebar{
width:100%;
}

.header h2{
font-size:35px;
}

.input-area input{
width:100%;
}

}

</style>
</head>

<body>

<div class="container">

<div class="sidebar">

<div class="logo">
<div class="logo-box"></div>

<div>
<h1>Infinite Void</h1>
<p>Hollow Purple Dashboard</p>
</div>
</div>

<div class="menu">

<button onclick="showSection('vault')">🌌 Social Vault</button>

<button onclick="showSection('tools')">🧠 Infinite Tools</button>

<button onclick="showFavorites()">⭐ Favorites</button>

<button onclick="changeWallpaper()">🎨 Wallpapers</button>

<button onclick="toggleTheme()">⚙ Toggle Theme</button>

</div>

</div>

<div class="main">

<div class="header">

<div>
<h2 id="sectionTitle">Social Media Vault</h2>
<p id="sectionDesc">Save, organize, open and download instantly.</p>
</div>

<div class="input-area">

<input type="text" id="linkInput" placeholder="Paste social media link...">

<button onclick="addLink()">
Add Link
</button>

</div>

</div>

<div class="cards" id="cards"></div>

</div>

</div>

<script>

let links = JSON.parse(localStorage.getItem('infiniteVoidLinks')) || [];

const cards = document.getElementById('cards');

const wallpapers = [
'#050816',
'#12051f',
'#06111f',
'#111827',
'#1e1b4b'
];

let wallpaperIndex = 0;

const downloaders = {

tiktok:'https://savetik.co/en2',

instagram:'https://fastdl.app/en2#google_vignette',

youtube:'https://y2mate.nu',

facebook:'https://fdown.net/',

pinterest:'https://klickpin.com/',

twitter:'https://ssstwitter.com/',

x:'https://ssstwitter.com/',

capcut:'https://anydownloader.com/en/'

};

function detectPlatform(url){

url = url.toLowerCase();

if(url.includes('tiktok')) return ['TikTok','🎵'];

if(url.includes('instagram')) return ['Instagram','📸'];

if(url.includes('youtube') || url.includes('youtu.be')) return ['YouTube','▶'];

if(url.includes('facebook')) return ['Facebook','📘'];

if(url.includes('pinterest')) return ['Pinterest','📌'];

if(url.includes('twitter') || url.includes('x.com')) return ['Twitter/X','✖'];

if(url.includes('capcut')) return ['CapCut','🎬'];

return ['Unknown','🌌'];

}

function saveLinks(){

localStorage.setItem('infiniteVoidLinks',JSON.stringify(links));

}

function renderLinks(list = links){

cards.innerHTML='';

if(list.length===0){

cards.innerHTML=`
<div class="empty">
No links added yet.
</div>
`;

return;

}

list.forEach((item,index)=>{

cards.innerHTML += `

<div class="card">

<div class="card-top">

<div class="icon">${item.icon}</div>

<button class="favorite" onclick="toggleFavorite(${item.id})">
${item.favorite ? '⭐' : '☆'}
</button>

</div>

<div class="platform">${item.platform}</div>

<div class="link">${item.url}</div>

<div class="actions">

<button class="open-btn" onclick="window.open('${item.url}','_blank')">
Open
</button>

<button class="download-btn" onclick="openDownloader('${item.platform}','${item.url}')">
Download
</button>

<button class="copy-btn" onclick="copyLink('${item.url}')">
Copy
</button>

<button class="delete-btn" onclick="deleteLink(${item.id})">
Delete
</button>

</div>

</div>

`;

});

}

function addLink(){

const input = document.getElementById('linkInput');

const url = input.value.trim();

if(!url){

alert('Paste a link first.');

return;

}

const data = detectPlatform(url);

links.unshift({

id:Date.now(),

platform:data[0],

icon:data[1],

url:url,

favorite:false

});

saveLinks();

renderLinks();

input.value='';

}

function deleteLink(id){

links = links.filter(link => link.id !== id);

saveLinks();

renderLinks();

}

function toggleFavorite(id){

links = links.map(link => {

if(link.id === id){

return {

...link,

favorite:!link.favorite

};

}

return link;

});

saveLinks();

renderLinks();

}

function showFavorites(){

const favorites = links.filter(link => link.favorite);

document.getElementById('sectionTitle').innerText = 'Favorites';

document.getElementById('sectionDesc').innerText = 'Your favorite saved links.';

renderLinks(favorites);

}

function showSection(type){

if(type === 'vault'){

document.getElementById('sectionTitle').innerText = 'Social Media Vault';

document.getElementById('sectionDesc').innerText = 'Save, organize, open and download instantly.';

renderLinks();

}

if(type === 'tools'){

cards.innerHTML = `

<div class="card">
<div class="platform">TikTok Downloader</div>

<div class="actions">
<button class="download-btn" onclick="window.open('https://savetik.co/en2','_blank')">
Open Tool
</button>
</div>
</div>

<div class="card">
<div class="platform">Instagram Downloader</div>

<div class="actions">
<button class="download-btn" onclick="window.open('https://fastdl.app/en2#google_vignette','_blank')">
Open Tool
</button>
</div>
</div>

<div class="card">
<div class="platform">YouTube Downloader</div>

<div class="actions">
<button class="download-btn" onclick="window.open('https://y2mate.nu','_blank')">
Open Tool
</button>
</div>
</div>

`;

document.getElementById('sectionTitle').innerText = 'Infinite Tools';

document.getElementById('sectionDesc').innerText = 'Quick access downloader tools.';

}

}

function openDownloader(platform,url){

platform = platform.toLowerCase();

navigator.clipboard.writeText(url);

if(platform.includes('twitter')){

window.open(downloaders.twitter,'_blank');

alert('Link copied. Paste it in downloader.');

return;

}

const key = platform.split('/')[0].toLowerCase();

if(downloaders[key]){

window.open(downloaders[key],'_blank');

alert('Link copied. Paste it in downloader.');

}

}

function copyLink(url){

navigator.clipboard.writeText(url);

alert('Link copied.');

}

function toggleTheme(){

document.body.classList.toggle('light');

if(document.body.classList.contains('light')){

document.body.style.background = '#f4f4f4';

document.body.style.color = '#111';

}else{

document.body.style.background = '#050816';

document.body.style.color = 'white';

}

}

function changeWallpaper(){

wallpaperIndex++;

if(wallpaperIndex >= wallpapers.length){

wallpaperIndex = 0;

}

document.body.style.background = wallpapers[wallpaperIndex];

}

renderLinks();

</script>

</body>
</html>
