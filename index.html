<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Infinite Void</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#07070d;
color:white;
overflow-x:hidden;
min-height:100vh;
}

body::before{
content:'';
position:fixed;
width:500px;
height:500px;
background:purple;
filter:blur(180px);
top:-200px;
left:-100px;
opacity:.25;
z-index:-1;
}

body::after{
content:'';
position:fixed;
width:500px;
height:500px;
background:#3b82f6;
filter:blur(180px);
bottom:-200px;
right:-100px;
opacity:.20;
z-index:-1;
}

.container{
display:flex;
min-height:100vh;
}

.sidebar{
width:280px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
border-right:1px solid rgba(255,255,255,0.08);
padding:25px;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.logo{
display:flex;
align-items:center;
gap:15px;
margin-bottom:40px;
}

.logo-box{
width:50px;
height:50px;
border-radius:18px;
background:linear-gradient(135deg,#9333ea,#3b82f6);
}

.logo h1{
font-size:28px;
}

.logo p{
font-size:13px;
color:rgba(255,255,255,0.6);
}

.menu{
display:flex;
flex-direction:column;
gap:12px;
}

.menu button{
background:rgba(255,255,255,0.05);
border:none;
color:white;
padding:16px;
border-radius:18px;
cursor:pointer;
font-size:15px;
transition:.3s;
text-align:left;
}

.menu button:hover{
transform:translateX(5px);
background:rgba(255,255,255,0.1);
}

.main{
flex:1;
padding:30px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
flex-wrap:wrap;
margin-bottom:35px;
}

.top h2{
font-size:40px;
margin-bottom:8px;
}

.top p{
color:rgba(255,255,255,0.6);
}

.input-area{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.input-area input{
width:350px;
padding:16px 18px;
border:none;
outline:none;
border-radius:18px;
background:rgba(255,255,255,0.06);
color:white;
font-size:15px;
border:1px solid rgba(255,255,255,0.08);
}

.input-area button{
padding:16px 25px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#9333ea,#3b82f6);
color:white;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.input-area button:hover{
transform:scale(1.05);
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:22px;
}

.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
padding:22px;
border-radius:28px;
backdrop-filter:blur(20px);
transition:.4s;
}

.card:hover{
transform:translateY(-6px);
border-color:rgba(168,85,247,.5);
}

.card-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}

.icon{
width:55px;
height:55px;
border-radius:18px;
background:rgba(255,255,255,0.08);
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
}

.platform{
font-size:25px;
font-weight:600;
margin-bottom:8px;
}

.link{
font-size:13px;
color:rgba(255,255,255,0.6);
word-break:break-all;
margin-bottom:20px;
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.actions button{
flex:1;
padding:12px;
border:none;
border-radius:14px;
cursor:pointer;
transition:.3s;
color:white;
}

.open-btn{
background:rgba(255,255,255,0.08);
}

.download-btn{
background:linear-gradient(135deg,#9333ea,#3b82f6);
}

.delete-btn{
background:rgba(239,68,68,0.2);
}

.actions button:hover{
transform:scale(1.03);
}

.empty{
padding:60px;
text-align:center;
background:rgba(255,255,255,0.05);
border-radius:28px;
color:rgba(255,255,255,0.6);
border:1px dashed rgba(255,255,255,0.1);
}

@media(max-width:900px){

.container{
flex-direction:column;
}

.sidebar{
width:100%;
}

.top h2{
font-size:32px;
}

.input-area input{
width:100%;
}

}

</style>
</head>
<body>

<div class="container">

<div class="sidebar">

<div>

<div class="logo">
<div class="logo-box"></div>

<div>
<h1>Infinite Void</h1>
<p>Hollow Purple Dashboard</p>
</div>
</div>

<div class="menu">
<button>🌌 Social Vault</button>
<button>🧠 Infinite Tools</button>
<button>⭐ Favorites</button>
<button>🎨 Wallpapers</button>
<button>⚙ Settings</button>
</div>

</div>

</div>

<div class="main">

<div class="top">

<div>
<h2>Social Media Vault</h2>
<p>Save, organize, open and download instantly.</p>
</div>

<div class="input-area">
<input type="text" id="linkInput" placeholder="Paste social media link...">

<button onclick="addLink()">Add Link</button>
</div>

</div>

<div class="cards" id="cards">

<div class="empty">
No links added yet.
</div>

</div>

</div>

</div>

<script>

let links = JSON.parse(localStorage.getItem('infiniteVoidLinks')) || [];

const cards = document.getElementById('cards');

const downloaders = {
tiktok:'https://savetik.co/en2',
instagram:'https://fastdl.app/en2#google_vignette',
youtube:'https://y2mate.nu',
facebook:'https://fdown.net/',
pinterest:'https://klickpin.com/',
twitter:'https://ssstwitter.com/',
x:'https://ssstwitter.com/',
capcut:'https://anydownloader.com/en/'
};

function detectPlatform(url){

url = url.toLowerCase();

if(url.includes('tiktok')) return ['TikTok','🎵'];
if(url.includes('instagram')) return ['Instagram','📸'];
if(url.includes('youtube') || url.includes('youtu.be')) return ['YouTube','▶'];
if(url.includes('facebook')) return ['Facebook','📘'];
if(url.includes('pinterest')) return ['Pinterest','📌'];
if(url.includes('twitter') || url.includes('x.com')) return ['Twitter/X','✖'];
if(url.includes('capcut')) return ['CapCut','🎬'];

return ['Unknown','🌌'];

}

function saveLinks(){
localStorage.setItem('infiniteVoidLinks',JSON.stringify(links));
}

function renderLinks(){

cards.innerHTML='';

if(links.length===0){

cards.innerHTML=`
<div class="empty">
No links added yet.
</div>
`;

return;

}

links.forEach((item,index)=>{

cards.innerHTML += `

<div class="card">

<div class="card-top">
<div class="icon">${item.icon}</div>
</div>

<div class="platform">${item.platform}</div>

<div class="link">${item.url}</div>

<div class="actions">

<button class="open-btn" onclick="window.open('${item.url}','_blank')">
Open
</button>

<button class="download-btn" onclick="openDownloader('${item.platform}')">
Download
</button>

<button class="delete-btn" onclick="deleteLink(${index})">
Delete
</button>

</div>

</div>

`;

});

}

function addLink(){

const input = document.getElementById('linkInput');

const url = input.value.trim();

if(!url) return;

const data = detectPlatform(url);

links.unshift({
platform:data[0],
icon:data[1],
url:url
});

saveLinks();
renderLinks();

input.value='';

}

function deleteLink(index){

links.splice(index,1);

saveLinks();
renderLinks();

}

function openDownloader(platform){

platform = platform.toLowerCase();

if(platform.includes('twitter')){
window.open(downloaders.twitter,'_blank');
return;
}

const key = platform.split('/')[0].toLowerCase();

if(downloaders[key]){
window.open(downloaders[key],'_blank');
}

}

renderLinks();

</script>

</body>
</html>
